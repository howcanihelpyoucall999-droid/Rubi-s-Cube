<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Robot | Premium Landing Page</title>
    <style>
        :root {
            --brand-blue: #0033ad;
            --glow-blue: rgba(0, 51, 173, 0.6);
            --pure-white: #ffffff;
            --text-main: #1a1a1a;
            --border-width: 1.5px;
        }

        /* Prevent scrolling and stretching */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--pure-white);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }

        /* Full Screen Wrapper */
        .viewport-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 1. TOP HEADER */
        header {
            width: 100%;
            padding: 4vh 6vw 0 6vw;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .logo-box {
            width: clamp(130px, 15vw, 180px);
            aspect-ratio: 2.8 / 1;
            border: var(--border-width) solid var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .menu-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: var(--border-width) solid var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            cursor: pointer;
        }

        .dot { width: 4px; height: 4px; background: var(--text-main); border-radius: 50%; }

        /* 2. PRODUCT SECTION */
        .product-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 6vw;
        }

        .product-box {
            width: clamp(250px, 40vw, 420px);
            aspect-ratio: 1.4 / 1;
            border: var(--border-width) solid var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            z-index: 5;
        }

        .product-box img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* 3. CENTERED ANIMATED WAVE (Full Width) */
        .wave-separator {
            width: 100vw; /* Touches both ends of the screen */
            height: 120px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .wave-svg {
            position: absolute;
            width: 200%; /* Double width for seamless looping */
            height: 100%;
            animation: moveWave 5s linear infinite;
            /* Blue glow effect */
            filter: drop-shadow(0 0 12px var(--glow-blue));
        }

        @keyframes moveWave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 4. BOTTOM SECTION (Headline & Button) */
        footer {
            width: 100%;
            padding: 0 6vw 8vh 6vw; /* High bottom padding to push items UP */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
        }

        .headline {
            font-size: clamp(28px, 4.5vh, 48px);
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 3vh;
            line-height: 1.1;
        }

        .buy-btn {
            display: inline-block;
            padding: clamp(14px, 2vh, 18px) clamp(45px, 8vw, 65px);
            border: 2px solid var(--text-main);
            border-radius: 100px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            font-size: clamp(16px, 2.2vh, 20px);
            transition: all 0.3s ease;
        }

        .buy-btn:hover {
            background: var(--brand-blue);
            color: white;
            border-color: var(--brand-blue);
            box-shadow: 0 5px 15px var(--glow-blue);
        }

        /* Adjustments for short screens / landscape */
        @media (max-height: 600px) {
            .wave-separator { height: 70px; }
            footer { padding-bottom: 4vh; }
            header { padding-top: 2vh; }
        }
    </style>
</head>
<body>

    <div class="viewport-container">
        
        <!-- Header -->
        <header>
            <div class="logo-box">
                <img src="logo.png" alt="Logo">
            </div>
            <button class="menu-btn">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </button>
        </header>

        <!-- Product Display -->
        <section class="product-section">
            <div class="product-box">
                <img src="product.png" alt="Robot">
            </div>
        </section>

        <!-- Centered, Thicker, Glowing, Infinite Running Wave -->
        <div class="wave-separator">
            <svg class="wave-svg" viewBox="0 0 1440 100" preserveAspectRatio="none">
                <!-- Two identical paths side-by-side for seamless looping -->
                <path d="M0 50 C 200 0, 400 100, 720 50 C 1040 0, 1240 100, 1440 50 L 2880 50" 
                      stroke="#0033ad" stroke-width="16" stroke-linecap="round" fill="none" />
                <path d="M1440 50 C 1640 0, 1840 100, 2160 50 C 2480 0, 2680 100, 2880 50" 
                      stroke="#0033ad" stroke-width="16" stroke-linecap="round" fill="none" />
            </svg>
        </div>

        <!-- Call to Action (Pushed Up) -->
        <footer>
            <h1 class="headline">Buy your Dream Robot</h1>
            <a href="#" class="buy-btn">Buy Now</a>
        </footer>

    </div>

</body>
</html>
